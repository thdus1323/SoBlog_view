<!DOCTYPE html>
<html lang="ko">

<head>
    <title>Soblog view</title>
    <link rel="shortcut icon" sizes="76x76" type="image/x-icon"
        href="./img/favicon.png">
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>

    <header class="header">
        <img class="logo" src="./img/logo.png">
        <nav class="nav">
            <a href="#">홈</a>
            <a href="#">피드</a>

        <input type="search" class="search-bar" placeholder="검색어 입력">

                </div>
            </div>

            <div class="post-list">
                <div class="post-item">
                    <div class="post-number">1</div>
                    <div class="article-content">
                        <div class="article-category">코리네</div>
                        <h3>쿠팡에서 이거 꼭 써보세요! 재구매각 추천템3 솔직리뷰</h3>
                    </div>
                    <div class="post-thumbnail">
                        <img src="./img/군고구마.png" alt="군고구마">
                    </div>
                </div>
                <!-- More post items -->
                <div class="post-item">

                    <div class="post-thumbnail">
                        <img src="./img/군고구마.png" alt="군고구마">
                    </div>
                </div>
            </div>
        </div>




        <div class="sidebar">

                <div class="login-card">
                    <h3>티스토리에 로그인하시고 더 많은 기능을 이용해보세요!</h3>
                    <button class="kakao-button">
                        <span>시작하기</span>
                    </button>
                </div>
                <div class="creator-card">
                    <h3>좋아요 크리에이터</h3>
                    <!-- Creator content -->
                </div>

                <!-- <div class="creator-card"> -->
                    <div class="creator-profile" >
                        <div class="creator-profile-header">
                            <h4>【제목】</h4>
